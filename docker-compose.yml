
services:
  database:
    image: mysql
    container_name: ems-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: 123
    ports:
      - 3307:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: ems-backend
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DB: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: 123
    ports:
      - 8080:8080
    depends_on:
      database:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: ems-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend